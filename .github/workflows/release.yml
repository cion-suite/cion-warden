name: Release

# Только после зелёного CI на push в main: упавшая сборка не получает тег.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: тег + GitHub Release
    # Ручной запуск только из main: теги ставятся только на релизы.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0

      - name: Resolve version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "Версия $version с prerelease-суффиксом: тегируются только стабильные релизы, пропуск."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # 2 - тега нет; любой другой код - сбой сети/доступа, не "тега нет"
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
            if [[ $status == 0 ]]; then
              echo "Тег v$version уже существует: релизить нечего."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [[ $status == 2 ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::git ls-remote упал с кодом $status"
              exit "$status"
            fi
          fi

      - name: Extract release notes
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! node scripts/release-notes.mjs docs/versions/release.md "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            echo "::error title=Нет лога релиза::в docs/versions/release.md нет непустого раздела '### Версия v$VERSION'. Релиз без лога не создаётся: выполни /notes <тег прошлого релиза>..HEAD, закоммить лог и запушь в main."
            exit 1
          fi

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Тег создаёт сам release: упавший create не оставляет тег,
        # и повторный запуск не примет его за готовый релиз.
        run: gh release create "v$VERSION" --target "$HEAD_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
