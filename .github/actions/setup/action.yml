name: Setup app + cion-suite
description: Checkout cion-suite sibling, setup pnpm/node, install+build cion-suite, install app.

inputs:
  cion-suite-token:
    description: PAT with read access to cion-suite/cion-suite.
    required: true
  frozen-lockfile:
    description: Pass --frozen-lockfile to app install ('true' | 'false').
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: cion-suite/cion-suite
        token: ${{ inputs.cion-suite-token }}
        path: cion-suite

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 11.27.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24.21.0
        cache: pnpm
        cache-dependency-path: |
          cion-warden/pnpm-lock.yaml
          cion-suite/pnpm-lock.yaml

    - name: Install + build cion-suite
      working-directory: cion-suite
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm -r build

    - name: Install cion-warden
      working-directory: cion-warden
      shell: bash
      run: |
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install --no-frozen-lockfile
        fi
